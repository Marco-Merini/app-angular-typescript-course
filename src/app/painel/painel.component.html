<div class="container">
    <div class="row">
      <div class="col-12">
        <app-progresso [progresso]="progresso"></app-progresso>
      </div>
    </div>
    
    <div class="card mt-3">
      <div class="card-body">
        <div class="row">
          <div class="col-sm-6 d-flex align-items-center">
            <span class="badge bg-secondary">Progresso: {{progresso}}%</span>
          </div>
          <div class="col-sm-6">
            <app-tentativas [tentativas]="tentativas"></app-tentativas>
          </div>
        </div>
        
        <div *ngIf="!jogoTerminado" class="row mt-3">
          <div class="col">
            <h4>{{ instrucao }}</h4>
            <p class="lead">{{ rodadaFrase.fraseEng }}</p>
            
            <div class="mb-3">
              <textarea 
                class="form-control" 
                rows="3"
                [value]="resposta"
                (input)="atualizaResposta($event)"
                placeholder="Digite a tradução aqui"
              ></textarea>
            </div>
          </div>
        </div>
        
        <div *ngIf="jogoTerminado" class="row mt-3">
          <div class="col text-center">
            <div class="alert" [class.alert-success]="progresso === 100" [class.alert-danger]="tentativas === 0">
              <h3>{{ mensagemFinal }}</h3>
            </div>
            <button type="button" class="btn btn-primary mt-3" (click)="reiniciarJogo()">Jogar Novamente</button>
          </div>
        </div>
        
        <div *ngIf="!jogoTerminado" class="row">
          <div class="col d-flex justify-content-end">
            <button type="button" class="btn btn-dark" (click)="verificarResposta()">Verificar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
